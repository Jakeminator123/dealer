<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dealer · 3D-scen</title>
<style>
:root{--bg:#0d0f0e;--panel:#151917;--line:#27302b;--ink:#e8ece9;--dim:#93a098;--acc:#d9b96a;--ok:#7fd39a;--warn:#e8a653}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 system-ui,"Segoe UI",sans-serif}
#app{display:grid;grid-template-columns:minmax(0,1fr) 340px;height:100%}
body.noui #app{grid-template-columns:1fr}
body.noui #panel,body.noui #hud{display:none}
#stage{position:relative;display:grid;place-items:center;min-width:0;min-height:0;overflow:hidden;background:#060706}
canvas{display:block;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
#hud{position:absolute;left:12px;top:10px;right:12px;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none}
.chip{background:rgba(10,12,11,.78);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px}
.chip.ok{color:var(--ok)}.chip.warn{color:var(--warn)}
#panel{background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:14px 14px 40px}
h1{font-size:15px;margin:0 0 2px}
.sub{color:var(--dim);margin:0 0 12px;font-size:12px}
.error{color:var(--warn);border:1px solid var(--warn);border-radius:8px;padding:8px 10px}
fieldset{border:1px solid var(--line);border-radius:8px;margin:0 0 10px;padding:8px 10px 10px;min-width:0}
legend{color:var(--acc);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:0 6px}
label.row{display:grid;grid-template-columns:104px 1fr 56px;align-items:center;gap:8px;margin:5px 0}
label.row.two{grid-template-columns:104px 1fr}
label.row output{color:var(--dim);text-align:right;font-variant-numeric:tabular-nums}
label.check{display:flex;gap:8px;align-items:center;margin:5px 0}
input[type=range]{width:100%;accent-color:var(--acc)}
select,input[type=text],button{background:#0e1210;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit;min-height:32px}
select,input[type=text]{width:100%}
button{cursor:pointer}button:hover{border-color:var(--acc)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;margin:4px 0}
.seg.rows{grid-auto-flow:row;grid-template-columns:repeat(3,1fr)}
.seg button{padding:6px 4px}
.seg button[aria-pressed=true]{background:var(--acc);color:#1a1404;border-color:var(--acc);font-weight:600}
.note{color:var(--dim);font-size:12px;margin:6px 0 0}
.note b{color:var(--ink)}
@media (max-width:900px){#app{grid-template-columns:1fr;grid-template-rows:58vh auto}#panel{border-left:0;border-top:1px solid var(--line)}}
</style>
<!-- three.js 0.180: the lab server decides where the module is served; this map is the single place that names it.
     The scope: the card material study imports its own vendored three.js. The rendered cards in the scene (scene3d-deal.ts)
     load the study as a separate instance (?scene3d) whose three.js is the scene's, so the page holds one copy of three.js. -->
<script type="importmap">{"imports":{"three":"/vendor/three.module.js","three/addons/":"/vendor/"},"scopes":{"/materials/source/src/card-material-study.js?scene3d":{"/materials/source/references/card-materials/vendor/three.module.js":"/vendor/three.module.js"},"/materials/source/src/chip-material-study.js":{"/materials/source/references/card-materials/vendor/three.module.js":"/vendor/three.module.js"}}}</script>
</head>
<body>
<div id="app">
  <div id="stage"><canvas id="view"></canvas><div id="hud"></div></div>
  <aside id="panel"></aside>
</div>
<script type="module" src="preview-ui.js"></script>
<script type="module" src="scene3d-ui.js"></script>
</body>
</html>
