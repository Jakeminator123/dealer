<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dealer · Kortets landning (prov)</title>
<style>
:root{--bg:#0d0f0e;--panel:#151917;--line:#27302b;--ink:#e8ece9;--dim:#93a098;--acc:#d9b96a;--ok:#7fd39a;--warn:#e8a653}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 system-ui,"Segoe UI",sans-serif}
#app{display:grid;grid-template-columns:minmax(0,1fr) 320px;height:100%}
#stage{position:relative;display:grid;grid-template-rows:minmax(0,1fr) auto;min-width:0;min-height:0;background:#060706}
#frame{position:relative;min-width:0;min-height:0;overflow:hidden}
#film{position:absolute;left:0;top:0;transform-origin:0 0}
#film video,#film canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;left:12px;top:10px;right:12px;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none}
.chip{background:rgba(10,12,11,.78);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px;font-variant-numeric:tabular-nums}
.chip.warn{color:var(--warn)}
#bar{padding:8px 14px 12px;border-top:1px solid var(--line);background:var(--panel)}
#tid{width:100%;margin:0;accent-color:var(--acc)}
#marks{position:relative;height:20px;margin:2px 8px 0}
#marks span{position:absolute;top:0;transform:translateX(-50%);color:var(--dim);font-size:11px;white-space:nowrap;padding-top:7px}
#marks span::before{content:"";position:absolute;left:50%;top:0;width:1px;height:6px;background:var(--acc)}
#panel{background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:14px 14px 40px}
h1{font-size:15px;margin:0 0 2px}
.sub{color:var(--dim);margin:0 0 12px;font-size:12px}
.error{color:var(--warn);border:1px solid var(--warn);border-radius:8px;padding:8px 10px}
fieldset{border:1px solid var(--line);border-radius:8px;margin:0 0 10px;padding:8px 10px 10px;min-width:0}
legend{color:var(--acc);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:0 6px}
select{width:100%;background:#0e1210;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit;min-height:32px}
label.row{display:grid;grid-template-columns:104px 1fr 52px;align-items:center;gap:8px;margin:5px 0}
label.row output{color:var(--dim);text-align:right;font-variant-numeric:tabular-nums}
label.check{display:flex;gap:8px;align-items:center;margin:8px 0 0}
input[type=range]{width:100%;accent-color:var(--acc)}
button{background:#0e1210;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font:inherit;min-height:32px;cursor:pointer}
button:hover{border-color:var(--acc)}
button[aria-pressed=true]{border-color:var(--acc);color:var(--acc)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.btns.seg button{flex:1}
.name{color:var(--dim);font-size:12px;margin:8px 0 0}
.note{color:var(--dim);font-size:12px;margin:6px 0 0}
@media (max-width:900px){#app{grid-template-columns:1fr;grid-template-rows:58vh auto}#panel{border-left:0;border-top:1px solid var(--line)}}
</style>
<!-- three.js as the 3D page has it (pages/scene3d.html): the lab server decides where the module is served. -->
<script type="importmap">{"imports":{"three":"/vendor/three.module.js","three/addons/":"/vendor/"}}</script>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="frame"><div id="film"><video id="video" muted playsinline preload="auto"></video><canvas id="view"></canvas></div><div id="hud"><span class="chip" id="rad">Läser …</span></div></div>
    <div id="bar"><input id="tid" type="range" min="0" max="1" step="1" value="0" aria-label="Ruta"><div id="marks"></div></div>
  </div>
  <aside id="panel"></aside>
</div>
<script type="module" src="preview-ui.js"></script>
<script type="module" src="card-landing-lab.js"></script>
</body>
</html>
