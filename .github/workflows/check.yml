name: Dealer checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: dealer-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      # The check scans the pushed commits (secrets, media, large files, the canonical documents) and then runs every test
      # that npm test runs (TESTS in tools/publication-check.ts). Tests that need FFmpeg or the bank's films skip here.
      - name: Publication check and all tests
        run: npm run check
        env:
          PUBLICATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
